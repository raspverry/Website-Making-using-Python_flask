{% extends "base.html" %}
{% block title %}Edit {{ space.name }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-8">
        <a href="{{ url_for('dashboard.space_detail', space_uid=space.uid) }}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Back to {{ space.name }}</a>
        <h1 class="text-2xl font-bold text-gray-900 mt-2">Edit Space</h1>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 p-8">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Space Name *</label>
                <input type="text" name="name" id="name" required minlength="2"
                       value="{{ space.name }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
            </div>

            <div>
                <label for="website_url" class="block text-sm font-medium text-gray-700 mb-1">Website URL</label>
                <input type="url" name="website_url" id="website_url"
                       value="{{ space.website_url or '' }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
            </div>

            <div>
                <label for="header_text" class="block text-sm font-medium text-gray-700 mb-1">Collection Form Header</label>
                <input type="text" name="header_text" id="header_text"
                       value="{{ space.header_text }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
            </div>

            <div>
                <label for="thank_you_text" class="block text-sm font-medium text-gray-700 mb-1">Thank You Message</label>
                <input type="text" name="thank_you_text" id="thank_you_text"
                       value="{{ space.thank_you_text }}"
                       class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition">
            </div>

            <div class="flex space-x-4">
                <button type="submit"
                        class="flex-1 bg-brand-600 text-white py-2.5 px-4 rounded-lg font-medium hover:bg-brand-700 transition">
                    Save Changes
                </button>
                <a href="{{ url_for('dashboard.space_detail', space_uid=space.uid) }}"
                   class="px-6 py-2.5 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50 transition text-center">
                    Cancel
                </a>
            </div>
        </form>
    </div>

    <!-- Danger Zone -->
    <div class="mt-8 bg-white rounded-xl border border-red-200 p-8">
        <h3 class="text-lg font-semibold text-red-700 mb-2">Danger Zone</h3>
        <p class="text-sm text-gray-600 mb-4">Deleting a space will permanently remove all its testimonials and widgets.</p>
        <form method="POST" action="{{ url_for('dashboard.delete_space', space_uid=space.uid) }}"
              onsubmit="return confirm('Are you sure? This cannot be undone.')">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-red-700 transition">
                Delete Space
            </button>
        </form>
    </div>
</div>
{% endblock %}
