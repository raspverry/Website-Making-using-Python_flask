{% extends "base.html" %}
{% block title %}Add Website{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <a href="{{ url_for('dashboard.index') }}" class="text-sm text-gray-500 hover:text-gray-700">&larr; Back to Dashboard</a>
    <h1 class="text-2xl font-bold text-gray-900 mt-2 mb-6">Add a Website to Scan</h1>
    <div class="bg-white rounded-xl border border-gray-200 p-8">
        <form method="POST" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="url" class="block text-sm font-medium text-gray-700 mb-1">Website URL *</label>
                <input type="text" name="url" id="url" required value="{{ url if url is defined else '' }}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="https://yourwebsite.com">
            </div>
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                <input type="text" name="name" id="name" value="{{ name if name is defined else '' }}" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none" placeholder="My Website (optional)">
            </div>
            <button type="submit" class="w-full bg-brand-600 text-white py-2.5 rounded-lg font-medium hover:bg-brand-700 transition">Add & Scan Now</button>
        </form>
    </div>
</div>
{% endblock %}
